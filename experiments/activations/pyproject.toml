[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sugar-cnn"
version = "0.1.0"
description = "SUGAR experiments and Figure 3 plots for VGG-16 and ResNet-18 on CIFAR-100."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "matplotlib>=3.10,<3.11",
    "PyYAML>=6.0",
    "tqdm>=4.64",
]

[tool.setuptools.packages.find]
include = ["cnn*"]

[tool.setuptools.package-data]
cnn = ["configs/*.yaml"]
