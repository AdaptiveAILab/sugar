[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sugar-mobilenet"
version = "0.1.0"
description = "SUGAR applied to MobileNetV2 transfer learning on HAM10000 and Oxford102."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "torchvision>=0.18",
    "numpy>=1.24",
    "scipy>=1.10",
    "Pillow>=9.0",
]

[tool.setuptools.packages.find]
include = ["mobilenet*"]
